name: 데스크톱 판

# 게임(island_world.html)이나 desktop/ 이 바뀌면 Windows · macOS · Linux 실행 파일을 새로 묶는다.
# 결과는 이 실행의 Artifacts(30일)에 남는다. v 로 시작하는 태그를 밀면 Releases 에도 붙인다.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'island_world.html'
      - 'three.min.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true          # 연달아 밀면 앞의 빌드는 버린다

jobs:
  build:
    name: 묶기 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, target: --win }
          - { os: macos-latest,   name: mac,     target: --mac }
          - { os: ubuntu-latest,  name: linux,   target: --linux }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write               # 태그일 때 Releases 에 붙이려고
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 의존성
        run: npm ci
      - name: 묶기
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 서명 인증서가 없다 — 서명 없이 묶는다
      - name: 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: CASTAWAY-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: 릴리스에 붙이기 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
